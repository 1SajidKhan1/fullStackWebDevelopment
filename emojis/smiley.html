<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
        }

        /* smiley face */
        .face {
            height: 300px;
            width: 300px;
            background-color: #ffa511;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            margin: 0 auto;
        }

        .eyes {
            background-color: black;
            height: 50px;
            width: 50px;
            display: inline-block;
            border-radius: 50%;
            position: relative;
            top: 70px;
        }

        .eyes1 {
            left: 60px;
        }

        .eyes2 {
            left: 130px;
        }

        .mouth {
            background-color: black;
            height: 20px;
            width: 200px;
            margin: 0 auto;
            position: relative;
            top: 160px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
        }
    </style>
</head>

<body>
    <div class="face">
        <div class="eyes eyes1"></div>
        <div class="eyes eyes2"></div>
        <div class="mouth"></div>
    </div>
</body>

</html>
